server:
  port: 8081

spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:h2:mem:bookingdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update

security:
  jwt:
    secret: my-secret-key-my-secret-key-my-secret-key-123

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
